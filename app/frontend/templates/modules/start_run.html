{% include '_header.html' %}

<div class="content-wrapper">
    <div class="container-fluid">
        <div class="row pt-3">
            <div class="col-sm-12">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-info">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
        </div>

        <div class="row">
            <div class="col-sm-12">
                <div class="card">
                    <div class="card-header">Start run</div>
                    <div class="card-body">
                        <p>Paste full JSON body for <code>POST /api/runs/start</code>:</p>
                        <form method="POST" action="/runs/start">
                            <div class="form-group">
                                <textarea class="form-control" name="start_payload" rows="18" placeholder='{"config": {...}}' required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Start</button>
                            <a href="/positions" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% include '_footer.html' %}
